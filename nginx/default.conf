
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic web application security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Product Service
    location = /api/products {
        proxy_pass http://product:5001/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/products/ {
        proxy_pass http://product:5001/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Order Service
    location = /api/orders {
        proxy_pass http://order:5002/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orders/ {
        proxy_pass http://order:5002/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

