
name: MicroMart CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            product-service/app.py \
            order-service/app.py

      - name: Build Docker images
        run: |
          docker build -t micromart-product:ci ./product-service
          docker build -t micromart-order:ci ./order-service

  deploy:
    name: Deploy to AWS EC2
    needs: ci

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package release
        run: |
          git archive --format=tar HEAD | gzip > release.tar.gz

      - name: Upload release to S3
        run: |
          aws s3 cp release.tar.gz \
            "s3://${{ vars.ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}.tar.gz"

      - name: Send SSM deployment command
        id: deployment
        env:
          EC2_ID: ${{ vars.EC2_INSTANCE_ID }}
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          COMMAND="sudo -u ubuntu env AWS_DEFAULT_REGION=${REGION} /usr/local/bin/micromart-deploy ${GITHUB_SHA} ${BUCKET}"

          jq -n --arg command "$COMMAND" \
            '{commands:[$command],executionTimeout:["1800"]}' \
            > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        env:
          EC2_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "AWS deployment completed successfully"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_ID"
              exit 1
            fi

            sleep 10
          done

          echo "Deployment verification timed out"
          exit 1
