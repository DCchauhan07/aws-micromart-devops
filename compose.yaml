
name: micromart

services:

  product:
    build:
      context: ./product-service

    image: micromart-product:v1

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: awslogs
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "/micromart/product"
        awslogs-stream: "${INSTANCE_ID}/product"
        mode: non-blocking
        max-buffer-size: "1m"

  order:
    build:
      context: ./order-service

    image: micromart-order:v1

    restart: unless-stopped

    user: "${HOST_UID}:${HOST_GID}"

    environment:
      PRODUCT_SERVICE_URL: http://product:5001
      DATABASE_PATH: /data/orders.db

    volumes:
      - ./data:/data

    networks:
      - backend

    depends_on:
      product:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: awslogs
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "/micromart/order"
        awslogs-stream: "${INSTANCE_ID}/order"
        mode: non-blocking
        max-buffer-size: "1m"

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - backend

    depends_on:
      product:
        condition: service_healthy
      order:
        condition: service_healthy

    logging:
      driver: awslogs
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "/micromart/nginx"
        awslogs-stream: "${INSTANCE_ID}/nginx"
        mode: non-blocking
        max-buffer-size: "1m"

networks:
  backend:
    driver: bridge

